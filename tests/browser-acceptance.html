<!doctype html><meta charset="utf-8"><title>Worldsmith browser acceptance</title>
<style>body{background:#13231e;color:#e6d8af;font:14px monospace}iframe{width:1920px;height:1080px;border:0}pre{white-space:pre-wrap}button{padding:10px}</style>
<h1>Worldsmith v0.5 acceptance</h1><button id="run">Run rendering checks</button> <button id="soak">Run five-minute soak</button><pre id="result">Ready. Tests use an isolated editor below.</pre><iframe src="../"></iframe>
<script>
const frame=document.querySelector('iframe'),out=document.querySelector('#result');let running=false;
const log=s=>out.textContent+='\n'+s,assert=(ok,s)=>{if(!ok)throw Error(s)},sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function ready(){const start=Date.now();while(true){const v=frame.contentWindow.WS?.app?.editor?.view,m=v?.metrics;if(m?.native&&!v.pending&&m.zoom===v.editor.zoom&&m.worldRevision===v.worldRevision&&m.readyChunks===m.visibleChunks&&m.visibleChunks>0&&!v.inflight.size)return;if(Date.now()-start>180000)throw Error('Renderer did not settle');await sleep(50)}}
async function run(job){if(running)return;running=true;out.textContent='Running…';try{await ready();await job(frame.contentWindow);log('COMPLETE')}catch(e){log('FAIL '+e.stack)}finally{running=false}}
document.querySelector('#run').onclick=()=>run(async w=>{const e=w.WS.app.editor,v=e.view;
for(const z of [.5,1,1.5,2]){e.zoomAt(z/e.zoom);await ready();assert(v.metrics.resolution===z*w.devicePixelRatio,'DPR mismatch');assert(v.svg.querySelectorAll('text').length>0,'Missing labels');log('PASS zoom '+z*100+'%, native DPR '+w.devicePixelRatio)}
const rev=v.worldRevision;for(let i=0;i<60;i++){e.offset.x+=Math.sin(i)*2;e.transform();await new Promise(w.requestAnimationFrame)}await ready();assert(rev===v.worldRevision,'Camera invalidated world');log('PASS camera preserves world revision');
const o=w.WS.objects.create('royalcastle',{x:768,y:600},'Boundary castle','qa-castle');o.scale=3;o.rotation=25;e.project.objects.push(o);e.draw();await ready();
for(const lod of [.5,1,2,4]){const rect={x:512,y:400,width:512,height:256},draw=async r=>(await v.service.request('probe',{revision:v.worldRevision,rect:r,resolution:lod,mode:'Atlas',texture:'Medium'},50)).image;
const images=[await draw(rect),await draw({...rect,width:256}),await draw({...rect,x:768,width:256})],a=document.createElement('canvas'),b=document.createElement('canvas');a.width=b.width=512*lod;a.height=b.height=256*lod;const ca=a.getContext('2d'),cb=b.getContext('2d');ca.drawImage(images[0],0,0);cb.drawImage(images[1],0,0);cb.drawImage(images[2],256*lod,0);const x=ca.getImageData(0,0,a.width,a.height).data,y=cb.getImageData(0,0,b.width,b.height).data;let changed=0;for(let i=0;i<x.length;i++)if(Math.abs(x[i]-y[i])>3)changed++;images.forEach(im=>im.close());assert(changed/x.length<.002,'Chunk seam mismatch');log('PASS split/whole render at LOD '+lod+'; differing channels '+(changed/x.length*100).toFixed(4)+'%')}
e.tool='height';e.radius=30;const before=JSON.stringify(e.project.terrain),history=e.history.length;e.beginStroke();e.drag={kind:'paint',last:{x:900,y:600}};e.queuePaint([{x:950,y:630}]);await sleep(100);e.flushPaint();e.endStroke();e.drag=null;await ready();assert(e.history.length===history+1,'Stroke history');assert(JSON.stringify(e.project.terrain)!==before,'Brush unchanged');e.undo();await ready();assert(JSON.stringify(e.project.terrain)===before,'Undo mismatch');log('PASS brush data and single-transaction undo');
for(const quality of ['Performance','Balanced','Ultra']){e.previewQuality.quality=quality;e.view.request(true);await ready();assert(v.metrics.backingScale>=w.devicePixelRatio,'Quality lowered DPR');log('PASS '+quality)}e.previewQuality.quality='Balanced';e.view.request(true);await ready();
let frames=0,active=true;const tick=()=>{if(active){frames++;w.requestAnimationFrame(tick)}};w.requestAnimationFrame(tick);const worker=new w.Worker('src/generator-worker.js'),messages=[];await new Promise((resolve,reject)=>{worker.onmessage=({data:d})=>{if(d.project)resolve();else if(d.error)reject(Error(d.error));else messages.push(d.message)};worker.onerror=reject;worker.postMessage({seed:'qa-worker',width:1800,height:1200,preset:'Dark Fantasy',params:w.WS.config.presets['Dark Fantasy'].params})});active=false;worker.terminate();assert(frames>2&&messages.length>=4,'Generation blocked UI');log('PASS generation: '+frames+' UI frames, '+messages.length+' progress stages');
for(const edge of [2048,4096,8192]){const blob=await w.WS.storage.png(e.project,{longEdge:edge}),size=blob.size;assert(size>10000,'Empty PNG');log('PASS PNG '+edge+' pixels, '+size+' bytes')}
});
document.querySelector('#soak').onclick=()=>run(async w=>{const e=w.WS.app.editor,v=e.view,p=e.project,r=w.WS.random.random('qa-soak');for(let i=0;i<2300;i++){const o=w.WS.objects.create('rock',{x:r()*p.width,y:r()*p.height},'Stress rock','qa-rock-'+i);o.layer='Decorations';p.objects.push(o)}e.draw();e.zoomAt(1/e.zoom);await ready();const start=performance.now(),origin={...e.offset},samples={pan:[],zoom:[],brush:[],cache:[]},next=()=>new Promise(w.requestAnimationFrame);let prev=await next(),stroke=false,lastReport=-1;while(performance.now()-start<300000){const now=await next(),seconds=(now-start)/1000,phase=Math.floor(seconds/10)%3,dt=now-prev;prev=now;if(phase!==2&&stroke){e.flushPaint();e.endStroke();e.drag=null;stroke=false}if(phase===0){e.offset.x=origin.x+Math.sin(seconds*.7)*180;e.offset.y=origin.y+Math.cos(seconds*.6)*100;e.transform();samples.pan.push(dt)}else if(phase===1){e.zoomAt(Math.pow(2,Math.sin(seconds*.3)*1.5)/e.zoom);samples.zoom.push(dt)}else{if(!stroke){e.tool='height';e.beginStroke();e.drag={kind:'paint',last:{x:900,y:600}};stroke=true}e.queuePaint([{x:900+Math.sin(seconds*1.7)*140,y:600+Math.cos(seconds*1.3)*80}]);samples.brush.push(v.brushMs)}const report=Math.floor(seconds/30);if(report>lastReport){lastReport=report;samples.cache.push(v.bytes);log(Math.round(seconds)+'s cache '+(v.bytes/1048576).toFixed(1)+' MiB; entities '+v.metrics.scene?.entities)}}if(stroke){e.flushPaint();e.endStroke();e.drag=null}await ready();assert(v.bytes<=v.metrics.cacheBudget,'Cache exceeded budget');const stats=a=>{a.sort((a,b)=>a-b);return{n:a.length,median:a[Math.floor(a.length*.5)],p95:a[Math.floor(a.length*.95)],max:a.at(-1)}};log(JSON.stringify({seconds:300,pan:stats(samples.pan),zoom:stats(samples.zoom),brush:stats(samples.brush),cacheBytes:samples.cache,finalCache:v.bytes,entities:v.metrics.scene,history:e.history.length},null,2));log('Memory scope: renderer cache only; total RAM/GC heap requires standalone test.');});
</script>
